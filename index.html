<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArchForm · 架构表单</title>
<style>
  /* ================= 架构图渲染规范（固化样式，勿随意改动） ================= */
  :root{
    --blue:#2379bd;
    --blue2:#2f80c2;
    --dash:#2c78c2;
    --panel:#c8ddef;
    --bg:#ffffff;
    --text:#26384a;
  }
  .arch{
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;
  }
  .arch *{box-sizing:border-box;margin:0;padding:0}
  .arch .canvas{
    width:100%;
    background:#fff;
    border:1px solid #2ba5e9;
    box-shadow:0 0 0 1px #d5efff inset;
    padding:14px 18px 16px;
  }
  .arch h1{
    margin:0 0 12px;
    font-size:26px;
    line-height:1.2;
    font-weight:700;
    color:#183c63;
  }
  .arch .subtitle{
    color:#5a7a9a;
    font-size:13px;
    margin:-6px 0 16px;
    letter-spacing:2px;
  }

  /* ===== layered 范式（多层横向） ===== */
  .arch .layer{
    display:grid;
    grid-template-columns:52px 1fr;
    border:2px dashed var(--dash);
    background:var(--panel);
    overflow:hidden;
    margin-bottom:14px;
  }
  .arch .layer .band{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    background:var(--band-bg,#2379bd);
    color:#fff;
    font-weight:700;
    font-size:17px;
    letter-spacing:3px;
    display:grid;
    place-items:center;
    padding:20px 0;
  }
  .arch .layer .body{
    padding:14px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:#fff;
  }
  .arch .layer-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding-bottom:10px;
    border-bottom:1px dashed var(--dash);
  }
  .arch .layer-head .zh{font-size:16px;font-weight:700;color:#183c63;letter-spacing:1px}
  .arch .layer-head .stat{font-size:12px;color:#5a7a9a;margin-left:auto}
  .arch .groups{display:grid;gap:12px;align-items:stretch}
  .arch .groups.col3{grid-template-columns:repeat(3,1fr)}
  .arch .groups.col2{grid-template-columns:repeat(2,1fr)}
  .arch .groups.col1{grid-template-columns:1fr}
  .arch .subdomain{
    background:#eef5fc;
    border:1px solid #b9d8f0;
    border-radius:2px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .arch .subdomain .sd-title{
    font-size:15px;
    font-weight:700;
    color:#183c63;
    padding-bottom:8px;
    border-bottom:1px solid #b9d8f0;
    text-align:center;
  }
  .arch .cards{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    flex:1;
  }
  .arch .card{
    background:var(--blue);
    color:#fff;
    border-radius:2px;
    padding:10px 12px;
    line-height:1.4;
    display:flex;
    flex-direction:column;
    flex:1 1 calc(50% - 5px);
  }
  .arch .card.span2{flex-basis:100%}
  .arch .card .t{
    font-size:15px;
    font-weight:700;
    color:#fff;
    margin-bottom:8px;
    text-align:center;
  }
  .arch .card .items{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    align-content:stretch;
    flex:1;
  }
  .arch .card .item{
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    border-radius:2px;
    padding:5px 4px;
    font-size:13px;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1 1 calc(50% - 3px);
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ===== cards 范式（DL1~DL3 资产目录） ===== */
  .arch .domain-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    gap:20px;
  }
  .arch .dl1-card{
    background:#fff;
    border:2px dashed var(--dash);
    border-radius:2px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .arch .dl1-header{
    background:var(--panel);
    padding:14px 16px;
    border-bottom:1px solid #b9d8f0;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .arch .dl1-title{font-size:17px;font-weight:700;color:#1a5c94}
  .arch .owner-tag{
    font-size:12px;background:#fff;color:#2379bd;
    border:1px solid #b9d8f0;padding:2px 8px;border-radius:2px;white-space:nowrap;
  }
  .arch .dl1-body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
  .arch .dl2-group{
    background:#eef5fc;border:1px solid #b9d8f0;border-radius:2px;padding:12px;
    flex:1;display:flex;flex-direction:column;
  }
  .arch .dl2-title{
    font-size:15px;font-weight:600;color:#2f80c2;
    margin-bottom:10px;padding-bottom:6px;border-bottom:1px dashed var(--dash);
  }
  .arch .dl3-list{display:flex;flex-direction:column;gap:8px;flex:1}
  .arch .dl3-item{
    background:#fff;border:1px solid #cfe3f5;border-radius:2px;padding:8px 10px;
    display:flex;justify-content:space-between;align-items:center;flex:1;
  }
  .arch .dl3-name{font-size:14px;font-weight:600;color:#26384a}
  .arch .dl3-entity{font-size:12px;color:#5a7a9a;margin-top:2px}
  .arch .dl3-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .arch .tag{
    font-size:11px;padding:2px 8px;border-radius:2px;white-space:nowrap;
    background:#eef5fc;color:#1a5c94;border:1px solid #b9d8f0;
  }
  .arch .tag.reuse{background:#f1f5f9;color:#64748b;border-color:#cbd5e1}
  .arch .tag.cat-master{background:#2379bd;color:#fff;border:none}
  .arch .tag.cat-trans{background:#059669;color:#fff;border:none}
  .arch .tag.cat-base{background:#d97706;color:#fff;border:none}
  .arch .tag.cat-obs{background:#7c3aed;color:#fff;border:none}
  .arch .tag.cat-rep{background:#475569;color:#fff;border:none}

  /* ===== central/组合视图（核心居中 + 上/左/右/下四向） ===== */
  .arch .central-wrap{
    display:grid;grid-template-columns:1fr 1.5fr 1fr;grid-template-rows:auto 1fr auto;
    gap:10px;align-items:stretch;
  }
  .arch .central-top{grid-column:1/-1}
  .arch .central-left{grid-column:1;grid-row:2}
  .arch .central-core{grid-column:2;grid-row:2}
  .arch .central-right{grid-column:3;grid-row:2}
  .arch .central-bottom{grid-column:1/-1;display:flex;gap:10px}
  .arch .central-side,.arch .central-core{
    border:2px dashed var(--dash);background:var(--panel);border-radius:2px;padding:12px;
    display:flex;flex-direction:column;gap:10px;
  }
  .arch .central-core{background:#d3e6f6}
  .arch .central-title{
    font-size:16px;font-weight:700;color:#1a5c94;text-align:center;
    padding-bottom:8px;border-bottom:1px dashed var(--dash);
  }
  .arch .central-block{
    background:var(--blue);color:#fff;border-radius:2px;padding:10px 12px;
    display:flex;flex-direction:column;gap:6px;flex:1;min-height:48px;
  }
  .arch .central-block .cb-t{font-size:15px;font-weight:700;text-align:center}
  .arch .central-block .cb-s{font-size:12px;color:rgba(255,255,255,.85);text-align:center}
  .arch .central-bottom .central-block{background:#0e2a47}
  .arch .central-top .central-block{background:#2f80c2}
  .arch .central-side .central-block{background:#2379bd}

  /* ===== 右侧垂直通栏（体系说明）：体系竖条横向并排，新增往右增加 ===== */
  .arch .side-layout{display:grid;grid-template-columns:1fr 8px var(--sidebar-w,460px);gap:0;align-items:stretch}
  .arch .side-main{min-width:0}
  .arch .side-divider{
    cursor:col-resize;background:transparent;position:relative;
  }
  .arch .side-divider::after{
    content:'';position:absolute;top:0;bottom:0;left:3px;width:2px;background:#b9d8f0;border-radius:1px;
  }
  .arch .side-divider:hover::after,.arch .side-divider.active::after{background:#2379bd;width:3px;left:2px}
  #captureArea:not(.editing) .side-divider{visibility:hidden;pointer-events:none}
  .arch .sidebar{display:flex;flex-direction:row;gap:6px;align-items:stretch}
  .arch .sbar{
    background:var(--sbar,#183c63);border:1px solid var(--sbar-border,#2c78c2);border-radius:2px;overflow:hidden;
    display:flex;flex-direction:column;flex:1 1 0;min-width:0;
  }
  .arch .sbar .sb-title{
    writing-mode:vertical-rl;text-orientation:mixed;background:#2379bd;color:#e8f2ff;
    font-weight:700;font-size:15px;letter-spacing:3px;
    display:flex;align-items:center;justify-content:center;padding:10px 0;min-height:70px;
  }
  /* 体系无说明条目时：标题充满整个竖条并放大 */
  .arch .sbar.no-items .sb-title{flex:1;min-height:0;font-size:19px}
  .arch .sbar .sb-items{
    display:flex;flex-direction:column;justify-content:center;gap:10px;padding:12px 10px;flex:1;
  }
  .arch .sbar .sb-item{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
    border-radius:2px;color:#fff;font-size:14px;text-align:center;padding:6px 8px;
  }

  /* ===== 底部图例通栏 ===== */
  .arch .legend-bar{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 20px;
    border:1px dashed var(--dash);background:#eef5fc;border-radius:2px;
    padding:8px 16px;margin-top:14px;
  }
  .arch .legend-item{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#3a5b7d}
  .arch .legend-item .lg-sw{width:14px;height:14px;border-radius:2px;border:1px solid rgba(0,0,0,.15);flex:none}
  .arch .legend-item .lg-line{width:22px;height:0;border-top:3px solid;flex:none}

  /* 编辑态高亮（导出时移除 .editing）：琥珀金选中，与蓝色系互补且醒目 */
  #captureArea.editing .arch [data-id]{outline:1px dashed rgba(245,166,35,.4);outline-offset:-1px;cursor:pointer}
  #captureArea.editing .arch [data-id]:hover{outline-color:rgba(245,166,35,.8);background:rgba(0,0,0,.1)}

  /* ================= 编辑器 UI（与架构图渲染样式隔离） ================= */
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#eef1f5;color:#26384a}
  #toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#1f2d3d;color:#fff;padding:8px 14px;position:sticky;top:0;z-index:100;
  }
  #toolbar .tb-title{font-size:15px;font-weight:700;margin-right:6px}
  #toolbar label{font-size:12px;color:#a8b7c6}
  #toolbar input[type=text],#toolbar select{
    border:1px solid #46586d;border-radius:3px;padding:4px 8px;font-size:13px;background:#2b3b4d;color:#fff;
  }
  #toolbar button{
    border:1px solid #46586d;border-radius:3px;background:#2b3b4d;color:#e6edf5;
    padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  #toolbar button:hover{background:#3a4d63}
  #toolbar button.primary{background:#2379bd;border-color:#2379bd}
  #toolbar button.primary:hover{background:#1a5c94}
  /* GitHub 快速导航(纯文字链接,不加载任何外部资源) */
  #toolbar .tb-sep{width:1px;height:20px;background:#46586d;margin:0 2px}
  #toolbar .gh-link{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid #46586d;border-radius:3px;background:#2b3b4d;color:#e6edf5;
    padding:4px 12px;font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit;
  }
  #toolbar .gh-link .gh-ico{flex:none;opacity:.9}
  #toolbar .gh-link:hover{background:#3a4d63;color:#fff}
  #toolbar .gh-star{border-color:#b7791f;color:#f6c445}
  #toolbar .gh-star:hover{background:#4a3a1a;color:#fde68a}
  #toolbar .gh-fork{border-color:#46586d}
  #toolbar .spacer{flex:1}
  /* 下拉菜单 */
  #toolbar .menu{position:relative}
  #toolbar .menu-drop{
    display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:170px;
    background:#fff;border:1px solid #d8dee6;border-radius:4px;
    box-shadow:0 6px 20px rgba(31,45,61,.18);z-index:300;padding:5px;
  }
  #toolbar .menu-drop.open{display:block}
  #toolbar .menu-drop button{
    display:block;width:100%;text-align:left;border:0;background:none;border-radius:3px;
    padding:6px 12px;font-size:13px;color:#26384a;cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  #toolbar .menu-drop button:hover{background:#eef5fc}
  #toolbar .menu-drop hr{border:0;border-top:1px solid #e3e8ef;margin:5px 0}
  /* 配色方案菜单 */
  #menu-scheme{min-width:240px}
  .scheme-list{display:flex;flex-direction:column;gap:3px}
  .scheme-list button[data-scheme]{
    display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;border-radius:3px;
    padding:6px 8px;font-size:13px;color:#26384a;cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .scheme-list button[data-scheme]:hover{background:#eef5fc}
  .scheme-list button[data-scheme].sel{background:#d6e6f7;outline:1px solid #2379bd}
  .sch-dots{display:inline-flex;gap:2px}
  .sch-dots i{width:13px;height:13px;border-radius:2px;border:1px solid rgba(0,0,0,.12)}
  .scheme-custom{display:flex;gap:5px;margin-top:4px}
  .scheme-custom input{width:100%;height:26px;padding:0;border:1px solid #c3cdd9;border-radius:3px;background:#fff;cursor:pointer}
  .scheme-btn{
    width:100%;margin-top:6px;border:1px solid #b8c6d6;background:#fff;border-radius:3px;
    padding:5px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .scheme-btn:hover{background:#eef5fc}
  #app{display:grid;grid-template-columns:260px 1fr 300px;gap:0;height:calc(100vh - 52px)}
  #treePanel,#propPanel{
    background:#f7f9fc;border-right:1px solid #d8dee6;overflow:auto;padding:10px;
  }
  #propPanel{border-right:none;border-left:1px solid #d8dee6}
  #canvasPanel{overflow:auto;padding:14px;background:#e4e9f0}
  #zoomWrap{width:100%}
  #captureArea{width:1600px;max-width:none;margin:0;transform-origin:top left;flex-shrink:0}
  /* 预览模式：仅保留工具栏（缩放/导出仍可用），隐藏左右面板 */
  body.preview #treePanel, body.preview #propPanel{display:none}
  body.preview #app{grid-template-columns:1fr;height:calc(100vh - 52px)}
  body.preview #canvasPanel{padding:20px;display:flex;justify-content:center;align-items:flex-start}
  body.preview #zoomWrap{display:block;flex:none}
  body.preview #captureArea{box-shadow:0 4px 24px rgba(31,45,61,.25)}
  .panel-title{font-size:13px;font-weight:700;color:#1f2d3d;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid #d8dee6}
  .tree{list-style:none;margin:0;padding:0;font-size:13px}
  .tree li{margin:1px 0}
  .tree .tnode{
    display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:3px;cursor:pointer;
  }
  .tree .tnode:hover{background:#e8eef6}
  .tree .tnode.sel{background:#d6e6f7;outline:1px solid #2379bd}
  .tree .tnode .caret{width:14px;text-align:center;color:#7a93ad;flex:none}
  .tree .tnode .ico{flex:none;font-size:11px;width:16px;text-align:center}
  .tree .tnode .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree .tnode .act{visibility:hidden;display:flex;gap:2px}
  .tree .tnode:hover .act,.tree .tnode.sel .act{visibility:visible}
  .tree .tnode .act button{
    border:1px solid #b8c6d6;background:#fff;color:#3a5b7d;border-radius:3px;
    font-size:10px;width:18px;height:18px;line-height:1;cursor:pointer;padding:0;
  }
  .tree .tnode .act button:hover{background:#2379bd;color:#fff;border-color:#2379bd}
  .tree ul{list-style:none;margin:0;padding-left:16px}
  .prop-group{margin-bottom:14px}
  .prop-group .pg-title{font-size:12px;font-weight:700;color:#5a7a9a;margin-bottom:6px}
  .prop-field{margin-bottom:8px}
  .prop-field label{display:block;font-size:12px;color:#5a7a9a;margin-bottom:2px}
  .prop-field input[type=text],.prop-field select{
    width:100%;border:1px solid #c3cdd9;border-radius:3px;padding:5px 8px;font-size:13px;box-sizing:border-box;
  }
  .prop-field textarea{
    width:100%;border:1px solid #c3cdd9;border-radius:3px;padding:5px 8px;font-size:13px;box-sizing:border-box;
    font-family:inherit;resize:vertical;min-height:80px;
  }
  .chip-edit{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .chip-edit .chip-item{
    display:inline-flex;align-items:center;gap:4px;background:#eef5fc;border:1px solid #b9d8f0;
    border-radius:2px;padding:2px 6px;font-size:12px;
  }
  .chip-edit .chip-item button{
    border:0;background:none;color:#8a9fb5;cursor:pointer;font-size:11px;padding:0;
  }
  .chip-edit .chip-item button:hover{color:#e74c3c}
  .chip-add-row{display:flex;gap:4px;margin-top:6px}
  .chip-add-row input{flex:1;border:1px solid #c3cdd9;border-radius:3px;padding:4px 8px;font-size:12px}
  .chip-add-row button{border:1px solid #b8c6d6;background:#fff;border-radius:3px;cursor:pointer;padding:2px 10px;font-size:12px}
  /* 竖条颜色选择器 */
  .color-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .color-row .sw{
    width:26px;height:26px;border-radius:3px;border:2px solid #fff;
    box-shadow:0 0 0 1px #c3cdd9;cursor:pointer;padding:0;
  }
  .color-row .sw:hover{box-shadow:0 0 0 2px #2379bd}
  .color-row .sw.sel{box-shadow:0 0 0 2px #2379bd}
  .color-row input[type=color]{
    width:34px;height:26px;padding:0;border:1px solid #c3cdd9;border-radius:3px;
    background:#fff;cursor:pointer;
  }
  .hint{font-size:11px;color:#8a9fb5;margin-top:4px}
  .btn-row{display:flex;gap:6px;margin-top:8px}
  .btn-row button{
    flex:1;border:1px solid #b8c6d6;background:#fff;border-radius:3px;padding:5px;font-size:12px;cursor:pointer;
  }
  .btn-row button:hover{background:#eef5fc}
  .empty-tip{color:#8a9fb5;font-size:12px;text-align:center;padding:20px 0}
  /* 树内快速录入 */
  .quick-add{position:sticky;bottom:0;background:#f7f9fc;border-top:1px solid #d8dee6;padding:8px 10px;z-index:10}
  .qa-row{display:flex;align-items:center;gap:6px;border:1px solid #c3cdd9;border-radius:4px;background:#fff;padding:5px 8px}
  .qa-row:focus-within{border-color:#2379bd;box-shadow:0 0 0 2px rgba(35,121,189,.15)}
  .qa-ico{color:#2379bd;font-size:12px;flex:none}
  .qa-input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;background:transparent}
  .qa-hint{font-size:12px;color:#3a5b7d;padding:5px 0 0;line-height:1.6;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .qa-hint .qa-tag{display:inline-block;background:#eef5fc;border:1px solid #b9d8f0;border-radius:3px;padding:1px 7px;font-size:11px;color:#1a5c94;font-weight:600;white-space:nowrap}
  .qa-hint .qa-lvl{color:#2379bd;font-weight:700;font-size:13px}
</style>
<!-- ================= Google Analytics(GA4)统计(可选) =================
  默认关闭。启用方法:把下面 window.GA_MEASUREMENT_ID 改成你的 GA4 统计 ID(形如 G-XXXXXXXXXX)。
  仅在线托管(GitHub Pages / 自有域名)时加载;file:// 本地打开不加载,不影响离线使用。
  注意:谷歌服务在国内网络环境下可能无法访问,统计不到属正常现象,不影响工具本身。 -->
<script>
  window.GA_MEASUREMENT_ID = window.GA_MEASUREMENT_ID || 'G-KVMD8XZD58';   // GA4 统计 ID
  (function () {
    var gid = window.GA_MEASUREMENT_ID;
    if (!gid) return;
    if (location.protocol === 'file:') return;   // 本地离线使用不统计
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gid);
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
